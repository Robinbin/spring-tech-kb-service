apiVersion: apps/v1
kind: Deployment
metadata:
  name: springkb-ai-engine
  labels:
    app: springkb
    role: ai-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springkb
      role: ai-engine
  template:
    metadata:
      labels:
        app: springkb
        role: ai-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: springkb
          image: ghcr.io/your-org/spring-tech-kb-service:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRINGTECHKB_RUNTIME_ROLE
              value: ai-engine
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: springkb-db
                  key: url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: springkb-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: springkb-db
                  key: password
            - name: REDIS_HOST
              value: springkb-redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: springkb-redis
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: springkb-ai-engine
  labels:
    app: springkb
    role: ai-engine
spec:
  selector:
    app: springkb
    role: ai-engine
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
