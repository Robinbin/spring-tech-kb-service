apiVersion: v1
kind: ServiceAccount
metadata:
  name: springkb-prometheus-discovery
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: springkb-prometheus-discovery
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: springkb-prometheus-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: springkb-prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: springkb-prometheus-discovery
    namespace: monitoring
