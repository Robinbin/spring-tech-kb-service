apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: springkb-ai-engine
  labels:
    app: springkb
spec:
  scaleTargetRef:
    name: springkb-ai-engine
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: springkb-gateway-requests-active
        query: sum(gateway_requests_active{application="spring-tech-kb-service",role="ai-engine"})
        threshold: "10"
        ignoreNullValues: "false"
