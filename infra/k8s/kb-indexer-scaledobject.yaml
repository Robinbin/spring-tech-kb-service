apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: springkb-kb-indexer
  labels:
    app: springkb
spec:
  scaleTargetRef:
    name: springkb-kb-indexer
  pollingInterval: 15
  cooldownPeriod: 180
  minReplicaCount: 1
  maxReplicaCount: 8
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: springkb-knowledge-index-outbox-pending
        query: sum(knowledge_index_outbox_pending{application="spring-tech-kb-service",role="kb-indexer"})
        threshold: "50"
        ignoreNullValues: "false"
