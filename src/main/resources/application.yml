# 真实凭据由环境变量注入，不入仓库。
spring:
  application:
    name: spring-tech-kb-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springkb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
  ai:
    mcp:
      server:
        name: spring-tech-kb
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
    # F1 explicitly creates one Anthropic ChatModel per tier; automatic single-model
    # selection is disabled while OpenAI-compatible embedding remains enabled.
    model:
      chat: none
      embedding: openai
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy-key-for-a1-probe}
      chat:
        options:
          max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
    openai:
      # TEI 暴露 OpenAI 兼容的 /v1/embeddings；A3 将 TEI 映射到宿主机 :8081（Spring Boot 占 :8080）
      api-key: ${TEI_API_KEY:not-needed-for-tei}
      base-url: ${TEI_BASE_URL:http://localhost:8081}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1024
        index-type: hnsw
        distance-type: cosine_distance
    # A5：Spring AI GenAI 观测配置
    # include-prompt / include-completion 默认关闭，避免敏感内容进入 trace；
    # 开发调试时可通过环境变量 AI_OBS_INCLUDE_COMPLETION=true 临时启用。
    chat:
      observations:
        include-prompt: false
        include-completion: ${AI_OBS_INCLUDE_COMPLETION:false}
        include-error-logging: true
  # B1：Flyway 迁移配置
  # initialize-schema=false 已在 spring.ai.vectorstore.pgvector 中设置；
  # spring.jpa.hibernate.ddl-auto=none 保证 Hibernate 不覆盖 Flyway 管理的 schema。
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# A5：Actuator、Prometheus 指标与 OTel 追踪配置
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        rag.time_to_first_token: true
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # 本地 Jaeger：docker compose --profile obs up -d（见 infra/docker-compose.yml）
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    # 在日志中注入 OTel traceId / spanId，便于与 Jaeger/Grafana Tempo 关联
    level: "%5p [${spring.application.name:},%X{traceId},%X{spanId}]"

# B4：Reranker 服务配置（TEI /rerank 端点）
# 启用步骤：1) docker compose --profile rerank up -d  2) 设置 RERANKER_ENABLED=true
springtechkb:
  runtime:
    role: ${SPRINGTECHKB_RUNTIME_ROLE:all}
  langfuse:
    enabled: ${LANGFUSE_ENABLED:false}
    base-url: ${LANGFUSE_BASE_URL:http://localhost:3001}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
  gateway:
    rate-limit:
      requests-per-minute: ${API_RATE_LIMIT_PER_MINUTE:60}
      key-prefix: ${API_RATE_LIMIT_KEY_PREFIX:springkb:gateway:requests}
  ai:
    structured:
      deadline: ${STRUCTURED_GENERATION_DEADLINE:90s}
      max-attempts: ${STRUCTURED_GENERATION_MAX_ATTEMPTS:3}
    models:
      lite: ${LLM_MODEL_LITE:claude-3-5-haiku-latest}
      standard: ${LLM_MODEL_STANDARD:claude-sonnet-4-5}
      expert: ${LLM_MODEL_EXPERT:claude-opus-4-5}
      lite-effort: ${LLM_EFFORT_LITE:low}
      standard-effort: ${LLM_EFFORT_STANDARD:medium}
      expert-effort: ${LLM_EFFORT_EXPERT:high}
  llm:
    ttft-timeout: ${LLM_TTFT_TIMEOUT:5s}
    stream-timeout: ${LLM_STREAM_TIMEOUT:120s}
    circuit-breaker:
      sliding-window-size: ${LLM_CB_WINDOW_SIZE:10}
      minimum-number-of-calls: ${LLM_CB_MIN_CALLS:5}
      failure-rate-threshold: ${LLM_CB_FAILURE_RATE:50}
      wait-duration-in-open-state: ${LLM_CB_OPEN_WAIT:30s}
    quota:
      daily-token-limit: ${LLM_DAILY_TOKEN_LIMIT:100000}
      key-prefix: ${LLM_QUOTA_KEY_PREFIX:springkb:llm:tokens}
  reranker:
    enabled: ${RERANKER_ENABLED:false}
    base-url: ${RERANKER_BASE_URL:http://localhost:8082}
    model: ${RERANKER_MODEL:BAAI/bge-reranker-v2-m3}
  rag:
    prompt-version: ${RAG_PROMPT_VERSION:v1}
    prompt-registry:
      admin-token: ${PROMPT_REGISTRY_ADMIN_TOKEN:}
    agentic:
      max-iterations: ${RAG_AGENTIC_MAX_ITERATIONS:3}
    semantic-cache:
      minimum-similarity: ${RAG_CACHE_MINIMUM_SIMILARITY:0.88}
      ttl-hours: ${RAG_CACHE_TTL_HOURS:6}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:spring-tech-kb}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  assessment:
    sandbox:
      strategy: ${ASSESSMENT_SANDBOX_STRATEGY:local}
      compile-timeout: ${ASSESSMENT_SANDBOX_COMPILE_TIMEOUT:5s}
      run-timeout: ${ASSESSMENT_SANDBOX_RUN_TIMEOUT:2s}
      max-memory-mb: ${ASSESSMENT_SANDBOX_MAX_MEMORY_MB:128}
      max-source-chars: ${ASSESSMENT_SANDBOX_MAX_SOURCE_CHARS:20000}
    quality:
      minimum-score:
        draft: ${ASSESSMENT_DRAFT_MIN_QUALITY:65}
        approval: ${ASSESSMENT_APPROVAL_MIN_QUALITY:75}
      stale-source-days: ${ASSESSMENT_STALE_SOURCE_DAYS:120}
    irt:
      cron: ${ASSESSMENT_IRT_CRON:0 */30 * * * *}
